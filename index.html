<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a1020" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Learn Dholuo (Luo), starting with Kenyan Luo. Made with love.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dholuo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Dholuo for Noela</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main id="view"></main>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>

  <!-- Lesson overlay: opened by js/lesson.js -->
  <div id="lesson" class="lesson" role="dialog" aria-modal="true" aria-label="Lesson" hidden>
    <div class="lesson-top">
      <button class="icon-btn" data-action="close" aria-label="Close lesson"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="progress"><i id="progress"></i></div>
      <b id="lesson-xp">0 XP</b>
    </div>
    <div id="lesson-body" class="lesson-body"></div>
    <div id="lesson-actions" class="lesson-actions"></div>
    <div id="feedback" class="feedback"></div>
  </div>

  <!-- "Leave this lesson?" sheet and a small message toast: controlled by js/app.js -->
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-panel">
      <h3 id="sheet-title">Leave this lesson?</h3>
      <p>Answers so far are already saved. You can start the lesson again any time.</p>
      <div class="sheet-actions">
        <button class="btn primary" data-action="stay">Keep learning</button>
        <button class="btn" data-action="leave">Leave lesson</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript>Please turn on JavaScript to use this app.</noscript>

  <!-- Order matters: data, state, helpers, features, views, then the app bootstrap. -->
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
